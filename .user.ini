; Hostinger (and most shared hosting) run PHP via PHP-FPM/LiteSpeed, where
; .htaccess php_value directives are ignored — .user.ini is the directive
; that actually applies there. Mirrors the limits Railway's nixpacks.toml
; passes via `php -d` for the same reason (Clinic Video upload feature,
; api/clinic/upload_video.php). Hostinger's own PHP hard ceiling (set in
; hPanel → PHP Configuration) still wins if it's lower than this.
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 300
max_input_time = 300
