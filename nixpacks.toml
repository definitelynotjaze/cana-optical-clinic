[phases.setup]
# ffmpeg (specifically ffprobe) is used by api/clinic/upload_video.php to
# reject video uploads whose actual codec Safari/iOS can't play (e.g. VP9
# muxed into an .mp4 container, which passes a naive MIME-type check but
# silently fails to play on Apple devices — see clinic-video.mp4 incident).
nixPkgs = ["php83", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.openssl", "php83Extensions.curl", "php83Extensions.zip", "php83Packages.composer", "ffmpeg"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[start]
# -d flags mirror the local XAMPP php.ini limits (see C:\xampp\php\php.ini)
# for video uploads (Clinic Settings → Clinic Video) — a generous but real
# ceiling, not PHP's restrictive stock defaults (2M/8M) that would otherwise
# apply here since no php.ini is shipped with this deployment.
cmd = "php -d upload_max_filesize=2048M -d post_max_size=2048M -d max_execution_time=300 -d max_input_time=300 -S 0.0.0.0:$PORT -t ."
